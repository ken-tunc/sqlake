[package]
name = "sqlake-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
sqlake-core.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlake-driver-mock.workspace = true
# The real library, in memory. A second implementation of `Library` written
# for tests would be a second set of answers to drift from the file's.
sqlake-library.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
