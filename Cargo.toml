[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ken-tunc/sqlake"
authors = ["ken-tunc"]

[workspace.dependencies]
sqlake-app = { path = "crates/sqlake-app" }
sqlake-config = { path = "crates/sqlake-config" }
sqlake-core = { path = "crates/sqlake-core" }
sqlake-driver-mock = { path = "crates/sqlake-driver-mock" }
sqlake-driver-postgres = { path = "crates/sqlake-driver-postgres" }
sqlake-tui = { path = "crates/sqlake-tui" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
# Must stay in step with the crossterm that ratatui re-exports as
# `ratatui::crossterm`; 0.30 pulls crossterm 0.29 through ratatui-crossterm.
# Declared directly only to turn on `event-stream`.
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
insta = "1"
keyring = "4"
postgres-protocol = "0.6"
ratatui = "0.30"
rust_decimal = { version = "1", features = ["db-postgres"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3"] }
# No `native-certs`: that feature only adds constructors this crate does not
# call. `tls.rs` builds its own `ClientConfig` from `rustls-native-certs`,
# because the roots are half of what an `sslmode` means.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# Lints are set to `warn` here and promoted to errors in CI with `-D warnings`,
# so a local build stays workable while nothing lands with a warning.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A curated selection from `pedantic`. The whole group is too noisy to keep at
# deny, but these each catch something real.
explicit_iter_loop = "warn"
if_not_else = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
