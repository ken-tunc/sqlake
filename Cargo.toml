[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/ken-tunc/sqlake"
authors = ["ken-tunc"]

[workspace.dependencies]
sqlake-app = { path = "crates/sqlake-app" }
sqlake-core = { path = "crates/sqlake-core" }
sqlake-driver-mock = { path = "crates/sqlake-driver-mock" }
sqlake-tui = { path = "crates/sqlake-tui" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# Must stay in step with the crossterm that ratatui re-exports as
# `ratatui::crossterm`; 0.30 pulls crossterm 0.29 through ratatui-crossterm.
# Declared directly only to turn on `event-stream`.
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
insta = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

# Lints are set to `warn` here and promoted to errors in CI with `-D warnings`,
# so a local build stays workable while nothing lands with a warning.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A curated selection from `pedantic`. The whole group is too noisy to keep at
# deny, but these each catch something real.
explicit_iter_loop = "warn"
if_not_else = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
